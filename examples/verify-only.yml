# drift-check.yml — VERIFY ONLY (no auto-fix, no PR)
#
# Use this when you just want CI to FAIL when the published spec has drifted from
# the code. No PR is opened; a human fixes it. driftsync's `diff` exits non-zero
# on BREAKING drift, which turns the check red.
#
# Runs on every push and pull request. Replace the "Extract" step with the one
# for your stack (see the other example workflows).

name: API Doc Drift Check
on:
  push:
    branches: ['**']
  pull_request: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Build driftsync
        run: |
          git clone https://github.com/karosia/driftsync /tmp/driftsync
          (cd /tmp/driftsync && go build -o /usr/local/bin/driftsync ./cmd/driftsync)

      # Replace with your stack's extraction step (huma / gin+swaggo / FastAPI / ...)
      - name: Extract spec from code
        run: go run ./tools/genspec        # -> openapi.gen.yaml

      # Fails the job on BREAKING drift -> red check on the commit / PR.
      # Add this job to branch protection to block merges with breaking drift.
      - name: Verify docs match code
        run: driftsync diff docs/openapi.yaml openapi.gen.yaml
