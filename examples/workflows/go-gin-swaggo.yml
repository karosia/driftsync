# drift-sync.yml — Go + gin (with swaggo annotations)
#
# gin doesn't emit a spec on its own. swaggo reads your handler annotations and
# generates one. Two caveats:
#   1) swaggo emits OpenAPI 2.0 — it must be converted to 3.x before driftsync.
#   2) you are comparing ANNOTATIONS vs the published doc, not code vs doc.
#      If the annotations are stale, that is its own drift.
#
# Copy this to .github/workflows/drift-sync.yml in your project.

name: API Doc Drift Sync
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-node@v4          # for the 2.0 -> 3.x converter
        with: { node-version: '20' }

      - name: Build driftsync
        run: |
          git clone https://github.com/karosia/driftsync /tmp/driftsync
          (cd /tmp/driftsync && go build -o /usr/local/bin/driftsync ./cmd/driftsync)

      # ── STEP 1: generate a 2.0 spec from swaggo annotations ─────────────────
      - name: Generate spec (swaggo)
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init --outputTypes yaml -o ./_swagger    # -> ./_swagger/swagger.yaml (OpenAPI 2.0)

      # ── STEP 1b: convert 2.0 -> 3.x (driftsync is 3.x-only) ─────────────────
      - name: Convert 2.0 -> 3.x
        run: |
          npx --yes swagger2openapi ./_swagger/swagger.yaml --yaml --outfile openapi.gen.yaml

      # ── STEP 2: detect drift, write a markdown report for the PR body ────────
      - name: Detect drift
        continue-on-error: true
        run: |
          driftsync diff --format md docs/openapi.yaml openapi.gen.yaml > drift-report.md
          echo "----- drift report -----"
          cat drift-report.md

      # ── STEP 3: apply fixes ──────────────────────────────────────────────────
      - name: Apply fixes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          driftsync apply docs/openapi.yaml openapi.gen.yaml > docs/openapi.new
          mv docs/openapi.new docs/openapi.yaml
          rm -rf openapi.gen.yaml ./_swagger
          # keep drift-report.md — Step 4 reads it as the PR body

      # ── STEP 4: open a PR, using the drift report as the PR body ─────────────
      - name: Open sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: drift/sync-openapi
          title: "docs: sync OpenAPI spec with code"
          commit-message: "docs: sync OpenAPI spec with code (automated)"
          body-path: drift-report.md
          labels: documentation, automated
