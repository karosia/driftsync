# drift-sync.yml — Java + Spring (springdoc-openapi)
#
# springdoc serves the spec at /v3/api-docs. We boot the app, curl the spec to a
# file, then driftsync reads it. springdoc emits 3.x, so no conversion.
#
# Copy this to .github/workflows/drift-sync.yml in your project.

name: API Doc Drift Sync
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }

      - name: Build driftsync
        run: |
          git clone https://github.com/karosia/driftsync /tmp/driftsync
          (cd /tmp/driftsync && go build -o /usr/local/bin/driftsync ./cmd/driftsync)

      # ── STEP 1: boot the app and fetch the spec ─────────────────────────────
      # Prefer the springdoc-openapi-maven-plugin if you have it (no server boot).
      # This variant boots the app and curls /v3/api-docs.yaml.
      - name: Build app
        run: ./mvnw -q -DskipTests package
      - name: Extract spec from code
        run: |
          java -jar target/*.jar &          # boot in background
          APP_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v3/api-docs.yaml -o openapi.gen.yaml && break
            sleep 2
          done
          kill $APP_PID || true

      # ── STEP 2: detect drift, write a markdown report for the PR body ────────
      - name: Detect drift
        continue-on-error: true
        run: |
          driftsync diff --format md docs/openapi.yaml openapi.gen.yaml > drift-report.md
          echo "----- drift report -----"
          cat drift-report.md

      # ── STEP 3: apply fixes ──────────────────────────────────────────────────
      - name: Apply fixes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          driftsync apply docs/openapi.yaml openapi.gen.yaml > docs/openapi.new
          mv docs/openapi.new docs/openapi.yaml
          rm -f openapi.gen.yaml
          # keep drift-report.md — Step 4 reads it as the PR body

      # ── STEP 4: open a PR, using the drift report as the PR body ─────────────
      - name: Open sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: drift/sync-openapi
          title: "docs: sync OpenAPI spec with code"
          commit-message: "docs: sync OpenAPI spec with code (automated)"
          body-path: drift-report.md
          labels: documentation, automated
