# drift-sync.yml — Go + huma
#
# huma is code-first and emits OpenAPI 3.1 natively, so the spec is extracted
# in-process via a tiny generator you add to your repo (see tools/genspec below).
#
# Copy this to .github/workflows/drift-sync.yml in your project.

name: API Doc Drift Sync
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Build driftsync
        run: |
          git clone https://github.com/karosia/driftsync /tmp/driftsync
          (cd /tmp/driftsync && go build -o /usr/local/bin/driftsync ./cmd/driftsync)

      # ── STEP 1: extract a spec from your code ────────────────────────────────
      # Requires tools/genspec/main.go in your repo:
      #
      #   package main
      #   import (
      #       "context"; "os"
      #       "github.com/karosia/driftsync/adapters/humaadapter"
      #       "your/module/app"        // your package that builds the huma.API
      #   )
      #   func main() {
      #       api := app.NewAPI()      // <- your real API constructor
      #       doc, err := humaadapter.New(api).Extract(context.Background())
      #       if err != nil { panic(err) }
      #       os.WriteFile("openapi.gen.yaml", doc.Raw, 0o644)
      #   }
      - name: Extract spec from code
        run: go run ./tools/genspec        # produces openapi.gen.yaml

      # ── STEP 2: detect drift, write a markdown report for the PR body ────────
      # continue-on-error so a breaking diff (exit 1) still lets the PR open.
      - name: Detect drift
        continue-on-error: true
        run: |
          driftsync diff --format md docs/openapi.yaml openapi.gen.yaml > drift-report.md
          echo "----- drift report -----"
          cat drift-report.md

      # ── STEP 3: apply fixes to the published spec ────────────────────────────
      - name: Apply fixes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}         # optional (fallback)
        run: |
          driftsync apply docs/openapi.yaml openapi.gen.yaml > docs/openapi.new
          mv docs/openapi.new docs/openapi.yaml
          rm -f openapi.gen.yaml
          # keep drift-report.md — Step 4 reads it as the PR body

      # ── STEP 4: open a PR, using the drift report as the PR body ─────────────
      - name: Open sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: drift/sync-openapi
          title: "docs: sync OpenAPI spec with code"
          commit-message: "docs: sync OpenAPI spec with code (automated)"
          body-path: drift-report.md
          labels: documentation, automated
