# .github/workflows/drift-check.yml — Java + Spring (springdoc-openapi)
#
# Fails CI when the published OpenAPI spec has drifted from what springdoc
# serves at /v3/api-docs, per your driftsync.yaml (see
# examples/config/spring.driftsync.yaml — its code.command boots the packaged
# jar to extract the spec, so build it first). Add this job to branch
# protection to block merges on breaking drift.
#
# Docs: https://github.com/karosia/driftsync#automating-with-github-actions

name: API Doc Drift Check

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: ./mvnw -B -DskipTests package   # or your Gradle equivalent

      - uses: karosia/driftsync@v1
        with:
          mode: check          # exit non-zero on drift (per fail_on in driftsync.yaml)
