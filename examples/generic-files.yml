# drift-sync.yml — GENERIC (you already have both specs as files)
#
# Use this if your build already produces an OpenAPI file from code by any means
# (a Makefile target, an existing codegen step, etc). driftsync doesn't care how
# the code-side file was made — it just compares two files.
#
# Set CODE_SPEC to your generated file and PUBLISHED_SPEC to your committed doc.

name: API Doc Drift Sync
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  CODE_SPEC: openapi.gen.yaml         # <- your generated-from-code spec
  PUBLISHED_SPEC: docs/openapi.yaml   # <- your committed published spec

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Build driftsync
        run: |
          git clone https://github.com/karosia/driftsync /tmp/driftsync
          (cd /tmp/driftsync && go build -o /usr/local/bin/driftsync ./cmd/driftsync)

      # ── STEP 1: produce the code-side spec however your project does it ──────
      - name: Generate code spec
        run: make openapi        # <- replace with your own command

      - name: Detect drift
        continue-on-error: true
        run: driftsync diff "$PUBLISHED_SPEC" "$CODE_SPEC"

      - name: Apply fixes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          driftsync apply "$PUBLISHED_SPEC" "$CODE_SPEC" > "$PUBLISHED_SPEC.new"
          mv "$PUBLISHED_SPEC.new" "$PUBLISHED_SPEC"
          rm -f "$CODE_SPEC"

      - name: Open sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: drift/sync-openapi
          title: "docs: sync OpenAPI spec with code"
          commit-message: "docs: sync OpenAPI spec with code (automated)"
          body: |
            Automated API documentation drift fix.
            Review before merging — check any **BREAKING** items in the drift log.
          labels: documentation, automated
