# GoReleaser config — builds the driftsync CLI for the composite GitHub Action
# and for direct download. Triggered by pushing a v* tag (see
# .github/workflows/release.yml).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: driftsync
    main: ./cmd/driftsync
    binary: driftsync
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: driftsync
    # action.yml expects: driftsync_<os>_<arch>.tar.gz  (lowercase os/arch)
    name_template: "driftsync_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
