# .github/workflows/drift-check.yml
#
# Fails CI when the published OpenAPI spec has drifted from the code, per your
# driftsync.yaml. No changes, no PR — a human fixes it. Add this job to branch
# protection to block merges on breaking drift.
#
# Docs: https://github.com/karosia/driftsync#automating-with-github-actions

name: API Doc Drift Check

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set up whatever toolchain your driftsync.yaml `code.command` needs to
      # generate the spec. Keep the one(s) that apply, delete the rest.
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # - uses: actions/setup-python@v5
      #   with: { python-version: "3.12" }
      # - uses: actions/setup-node@v4
      #   with: { node-version: "20" }
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: "21" }

      # Install any deps your extraction command imports, e.g.:
      # - run: pip install -r requirements.txt pyyaml
      # - run: npm ci

      - uses: karosia/driftsync@v1
        with:
          mode: check          # exit non-zero on drift (per fail_on in driftsync.yaml)
