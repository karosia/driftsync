name: release

on:
  push:
    # Tags with two dots only (v0.2.0) — excludes moving major-version tags
    # like v1, which action.yml consumers reference via
    # `uses: karosia/driftsync@v1`. Tag filters are glob (minimatch), not
    # regex, so this is "*.*.*" rather than a `[0-9]+` character class.
    # Without it, force-pushing v1 forward on every release re-triggers
    # GoReleaser and creates a duplicate GitHub Release for the same commit.
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
